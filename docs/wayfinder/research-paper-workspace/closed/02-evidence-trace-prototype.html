<!doctype html>
<!--
  THROWAWAY PROTOTYPE — 02 evidence-trace interaction
  Question: Which minimal browser flow makes paper selection, report editing,
  multi-source evidence inspection, and citation review legible on first use?
  Three layouts are switchable with ?variant=A|B|C. No API or persistence.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperRAG — Evidence Trace Prototype</title>
  <style>
    :root { --ink:#19212d; --muted:#64748b; --line:#dbe3ed; --paper:#fffefa; --bg:#f3f6fa; --blue:#2256d6; --blue-soft:#e9efff; --green:#16734b; --green-soft:#e9f8ef; --amber:#a5520a; --amber-soft:#fff3df; --red:#b94040; --shadow:0 12px 35px #23395d15; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.55 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); } button,input { font:inherit; } button { border:0; cursor:pointer; } .app { max-width:1440px; min-height:100vh; margin:auto; padding:28px 28px 92px; } .top { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:22px; } .brand { font-weight:800; letter-spacing:-.04em; font-size:21px; } .brand span { color:var(--blue); } .crumb { color:var(--muted); font-size:13px; } .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); } .pad { padding:18px; } h1,h2,h3,p { margin:0; } h1 { font-size:25px; letter-spacing:-.04em; } h2 { font-size:15px; } h3 { font-size:14px; } .muted { color:var(--muted); } .eyebrow { color:var(--blue); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:99px; font-size:12px; font-weight:700; } .ok { background:var(--green-soft); color:var(--green); } .pending { background:var(--amber-soft); color:var(--amber); } .quiet { background:#edf1f6; color:#536273; } .primary { padding:9px 12px; background:var(--blue); color:white; border-radius:8px; font-weight:700; } .secondary { padding:8px 11px; border:1px solid var(--line); background:white; border-radius:8px; color:#37465a; } .stack { display:grid; gap:12px; } .split { display:flex; justify-content:space-between; gap:10px; align-items:start; } .paper-row { padding:12px 0; border-top:1px solid var(--line); } .paper-row:first-of-type { border-top:0; } .paper-row h3 { margin-bottom:3px; } .marker { display:inline-flex; width:19px; height:19px; justify-content:center; align-items:center; border-radius:50%; background:var(--blue-soft); color:var(--blue); font-size:11px; font-weight:800; margin-left:3px; vertical-align:1px; cursor:pointer; } .claim { padding:13px; border:1px solid #cddafe; border-left:4px solid var(--blue); border-radius:8px; background:#f8faff; } .claim.pending-claim { border-color:#f0c58d; border-left-color:#e27b20; background:#fffaf1; } .claim p { font-size:15px; line-height:1.8; } .editable { outline:none; } .cite { padding:13px; border-top:1px solid var(--line); } .cite:first-child { border-top:0; } .quote { margin-top:8px; padding:9px 11px; background:#f6f8fb; border-radius:7px; color:#3f4b5b; font-family:ui-serif,serif; font-size:13px; } .location { color:var(--muted); font-size:12px; } .timeline { display:flex; gap:0; overflow:auto; } .step { min-width:116px; padding:10px; border-bottom:3px solid #d6dee9; color:var(--muted); } .step.done { border-color:var(--green); color:var(--ink); } .step.current { border-color:var(--blue); color:var(--blue); font-weight:700; } .number { display:inline-grid; place-items:center; width:21px; height:21px; border-radius:50%; background:#e7ecf5; font-size:11px; margin-right:5px; } .step.done .number { background:var(--green-soft); color:var(--green); } .step.current .number { background:var(--blue-soft); } .switcher { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:10; display:flex; gap:8px; align-items:center; padding:8px; border:1px solid #29364a; border-radius:999px; color:white; background:#182332; box-shadow:0 12px 30px #0005; } .switcher button { width:31px; height:31px; border-radius:50%; background:#314258; color:white; font-size:17px; } .switcher strong { min-width:145px; text-align:center; font-size:12px; } .notice { padding:9px 11px; border-radius:8px; color:var(--amber); background:var(--amber-soft); font-size:13px; } .review-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; } .review-actions button { padding:7px 9px; border-radius:7px; } .keep { background:#edf1f6; color:#344357; } .remove { background:#ffeded; color:var(--red); } .refresh { background:var(--blue); color:white; } .small { font-size:12px; } input { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:white; }
    /* Variant A: a guided, linear workspace. */ .a-grid { display:grid; grid-template-columns:275px minmax(0,1fr) 350px; gap:16px; } .a-main { display:grid; gap:16px; } .a-paper-list { max-height:505px; overflow:auto; } .a-evidence { position:sticky; top:18px; height:max-content; }
    /* Variant B: report-first composition with a narrow research drawer. */ .b-shell { display:grid; grid-template-columns:230px minmax(0,1fr); gap:16px; } .b-editor { max-width:850px; margin:auto; } .b-editor .card { min-height:630px; } .b-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px; } .b-evidence { margin-top:16px; border:1px solid #cddafe; background:#f8faff; } .b-drawer { height:max-content; position:sticky; top:18px; }
    /* Variant C: evidence-first ledger; report and evidence share a row. */ .c-title { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:end; margin-bottom:16px; } .c-work { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:16px; } .c-ledger { border-left:4px solid var(--blue); } .c-ledger .cite { padding:16px; } .c-report { display:grid; gap:16px; } .c-papers { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .paper-mini { padding:12px; border:1px solid var(--line); border-radius:9px; background:#fff; }
    @media (max-width:980px) { .a-grid,.b-shell,.c-work { grid-template-columns:1fr; } .a-evidence,.b-drawer { position:static; } .c-papers { grid-template-columns:1fr; } .app { padding:18px 14px 90px; } }
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><strong id="variant-label"></strong><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const variants = { A: 'A · 引导式工作流', B: 'B · 报告优先', C: 'C · 证据账本' };
    let variant = new URLSearchParams(location.search).get('variant') || 'A';
    if (!variants[variant]) variant = 'A';
    let pending = false;
    const papers = `
      <div class="paper-row"><div class="split"><div><h3>Graph Neural Networks: A Review</h3><p class="muted small">Wu et al. · 2021 · 上传 PDF</p></div><span class="pill ok">● 就绪</span></div><p class="location">18 页 · 42 个可检索 Chunk</p></div>
      <div class="paper-row"><div class="split"><div><h3>How Powerful are Graph Neural Networks?</h3><p class="muted small">Xu et al. · 2019 · arXiv</p></div><span class="pill ok">● 就绪</span></div><p class="location">9 页 · 26 个可检索 Chunk</p></div>
      <div class="paper-row"><div class="split"><div><h3>图神经网络在知识图谱中的应用</h3><p class="muted small">候选论文 · OpenAlex</p></div><span class="pill quiet">等待授权文件</span></div><p class="location">未进入检索或引用范围</p></div>`;
    function workspaceHeader(title, sub) { return `<header class="top"><div><div class="brand">Paper<span>RAG</span></div><div class="crumb">研究工作区 / 图神经网络在知识图谱推理中的应用</div></div><button class="secondary">导出 Markdown</button></header><div class="split" style="margin-bottom:16px"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div><span class="pill ok">工作区 · active</span></div>`; }
    function steps(current='report') { const items=[['topic','主题'],['papers','选论文'],['outline','大纲确认'],['report','写报告'],['review','审查引用']]; return `<div class="timeline card" aria-label="Research workspace steps">${items.map(([key,label],i)=>`<div class="step ${i < items.findIndex(x=>x[0]===current)?'done':''} ${key===current?'current':''}"><span class="number">${i < items.findIndex(x=>x[0]===current)? '✓': i+1}</span>${label}</div>`).join('')}</div>`; }
    function outline() { return `<section class="card pad"><div class="split"><div><h2>已批准的大纲</h2><p class="muted small">v3 · 6 个部分 · 生成报告时锁定</p></div><span class="pill ok">已批准</span></div><ol class="small"><li>研究问题与范围</li><li>方法与主要发现</li><li>方法比较</li><li>局限与研究缺口</li></ol></section>`; }
    function claim() { const text = pending ? '图神经网络在知识图谱推理中展现出显著且普遍优于传统方法的性能，并已解决可解释性问题。' : '图神经网络通过消息传递聚合邻居信息，因而适合表示知识图谱中的局部关系结构。'; return `<section class="claim ${pending?'pending-claim':''}"><div class="split"><span class="pill ${pending?'pending':'ok'}">${pending?'待审查':'已验证'} ${pending?'●':'✓'}</span><button class="secondary small" id="edit-claim">${pending?'恢复样例':'模拟实质性修改'}</button></div><p id="claim-text" class="editable" contenteditable="true">${text}<span class="marker" data-evidence="1">1</span><span class="marker" data-evidence="2">2</span></p>${pending?`<div class="notice">文字内容已变更。系统不再宣称原证据支持这句话，请审查或刷新。</div><div class="review-actions"><button class="keep">保留（用户确认）</button><button class="remove">移除引用</button><button class="refresh">从当前 2 篇就绪论文刷新</button></div>`:''}</section>`; }
    function evidence() { return `<section class="card ${variant==='C'?'c-ledger':''}"><div class="pad"><div class="split"><div><div class="eyebrow">Claim Citation · 2 个来源</div><h2>证据侧栏</h2></div><span class="pill ${pending?'pending':'ok'}">${pending?'待审查':'已验证'}</span></div><p class="muted small">点击引用标记后打开。展示的是 Citation Revision v1 的锚点快照。</p></div><article class="cite"><div class="split"><h3>1 · Graph Neural Networks: A Review</h3><span class="location">pp. 3–4</span></div><p class="location">§ 2. Message Passing Neural Networks</p><div class="quote">“GNNs learn representations by aggregating information from a node's local graph neighbourhood.”</div></article><article class="cite"><div class="split"><h3>2 · How Powerful are Graph Neural Networks?</h3><span class="location">p. 2</span></div><p class="location">§ 3. Graph Isomorphism Network</p><div class="quote">“A GNN iteratively updates a node representation by aggregating representations of its neighbours.”</div></article><div class="pad"><p class="location">来源：当前工作区 / 已选择 / 当前 Document Version / ready</p></div></section>`; }
    function reportBody() { return `<div class="stack"><section><div class="eyebrow">Literature Report · v5</div><h2 style="font-size:20px;margin:5px 0 12px">图神经网络在知识图谱推理中的研究进展</h2><p class="muted">以下是可编辑的报告正文。引用标记始终附在单个 Claim 后，而不是整段文字。</p></section><section><h2>2. 方法与主要发现</h2><p>现有研究通常将实体表示为节点、关系表示为边，并在图结构上学习上下文表征。</p>${claim()}</section><section><h2>3. 局限与研究缺口</h2><p>跨图泛化、长程依赖和数据偏差仍需由更多证据支持。</p></section></div>`; }
    function variantA() { return `${workspaceHeader('从主题到可审查的报告','guided workspace')} ${steps()}<div class="a-grid" style="margin-top:16px"><aside class="stack"><section class="card pad"><h2>研究主题</h2><input value="图神经网络在知识图谱推理中的应用" aria-label="研究主题"><button class="primary" style="width:100%;margin-top:9px">搜索候选论文</button></section><section class="card pad a-paper-list"><div class="split"><h2>论文选择</h2><span class="pill ok">2 已选择</span></div>${papers}</section></aside><section class="a-main">${outline()}<article class="card pad">${reportBody()}</article></section><aside class="a-evidence">${evidence()}</aside></div>`; }
    function variantB() { return `${workspaceHeader('报告是中心，证据随时可展开','report-first')}<div class="b-shell"><aside class="card pad b-drawer"><div class="eyebrow">Evidence boundary</div><h2>已选择论文</h2>${papers}<button class="secondary" style="width:100%;margin-top:10px">+ 发现或上传</button><hr style="border:0;border-top:1px solid var(--line);margin:17px 0">${outline()}</aside><section class="b-editor"><div class="card pad"><div class="b-header"><div><span class="pill ok">2 引用已验证</span><span class="pill quiet">大纲 v3</span></div><button class="primary">生成下一节</button></div>${reportBody()}</div><div class="b-evidence card">${evidence()}</div></section></div>`; }
    function variantC() { return `${workspaceHeader('把可审查性置于写作之前','evidence ledger')}<div class="c-title"><div>${steps('review')}</div><button class="primary">刷新所有待审查引用</button></div><div class="c-work"><section class="c-report"><div class="c-papers"><div class="paper-mini"><span class="pill ok">ready</span><h3>GNN Review</h3><p class="muted small">42 Chunk · 当前证据</p></div><div class="paper-mini"><span class="pill ok">ready</span><h3>GIN</h3><p class="muted small">26 Chunk · 当前证据</p></div></div><article class="card pad">${reportBody()}</article></section><aside>${evidence()}<section class="card pad" style="margin-top:16px"><h2>审查队列</h2><p class="muted">${pending?'1 个 Claim 等待你的决定':'没有待审查的引用'}</p></section></aside></div>`; }
    function render() { document.getElementById('app').innerHTML = variant==='A'?variantA():variant==='B'?variantB():variantC(); document.getElementById('variant-label').textContent=variants[variant]; document.querySelectorAll('.marker').forEach(x=>x.addEventListener('click',()=>document.querySelector('.card:last-child')?.scrollIntoView({behavior:'smooth'}))); const edit=document.getElementById('edit-claim'); if(edit) edit.addEventListener('click',()=>{pending=!pending; render();}); document.querySelectorAll('[contenteditable]').forEach(node=>node.addEventListener('input',()=>{ if(!pending){ pending=true; render(); }})); }
    function cycle(delta) { const keys=Object.keys(variants); variant=keys[(keys.indexOf(variant)+delta+keys.length)%keys.length]; const url=new URL(location); url.searchParams.set('variant',variant); history.replaceState({},'',url); render(); }
    document.getElementById('prev').onclick=()=>cycle(-1); document.getElementById('next').onclick=()=>cycle(1); document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);}); render();
  </script>
</body>
</html>
